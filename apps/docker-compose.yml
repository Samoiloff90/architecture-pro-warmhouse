services:
  # ============ DATABASES ============

  # PostgreSQL для монолита (smart_home)
  postgres:
    image: postgres:15-alpine
    container_name: warmhouse-postgres
    environment:
      POSTGRES_USER: warmhouse
      POSTGRES_PASSWORD: warmhouse123
      POSTGRES_DB: warmhouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - warmhouse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warmhouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL для Device Service
  device-db:
    image: postgres:15-alpine
    container_name: warmhouse-device-db
    environment:
      POSTGRES_USER: warmhouse
      POSTGRES_PASSWORD: warmhouse123
      POSTGRES_DB: device_db
    ports:
      - "5433:5432"
    volumes:
      - device_db_data:/var/lib/postgresql/data
      - ./device-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - warmhouse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warmhouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL для Telemetry Service
  telemetry-db:
    image: postgres:15-alpine
    container_name: warmhouse-telemetry-db
    environment:
      POSTGRES_USER: warmhouse
      POSTGRES_PASSWORD: warmhouse123
      POSTGRES_DB: telemetry_db
    ports:
      - "5434:5432"
    volumes:
      - telemetry_db_data:/var/lib/postgresql/data
      - ./telemetry-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - warmhouse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warmhouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ MESSAGE BROKER ============

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: warmhouse-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - warmhouse-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ MICROSERVICES ============

  # Temperature API (External service)
  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: warmhouse-temperature-api
    ports:
      - "8081:8081"
    networks:
      - warmhouse-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Device Service (Python/FastAPI)
  device-service:
    build:
      context: ./device-service
      dockerfile: Dockerfile
    container_name: warmhouse-device-service
    environment:
      DB_HOST: device-db
      DB_PORT: 5432
      DB_USER: warmhouse
      DB_PASSWORD: warmhouse123
      DB_NAME: device_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8082:8082"
    depends_on:
      device-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - warmhouse-network
    restart: unless-stopped

  # Telemetry Service (Node.js/Express)
  telemetry-service:
    build:
      context: ./telemetry-service
      dockerfile: Dockerfile
    container_name: warmhouse-telemetry-service
    environment:
      DB_HOST: telemetry-db
      DB_PORT: 5432
      DB_USER: warmhouse
      DB_PASSWORD: warmhouse123
      DB_NAME: telemetry_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      telemetry-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - warmhouse-network
    restart: unless-stopped

  # Smart Home Monolith (Go/Gin)
  smart-home:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: warmhouse-smart-home
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: warmhouse
      DB_PASSWORD: warmhouse123
      DB_NAME: warmhouse
      TEMPERATURE_API_URL: http://temperature-api:8081
      DEVICE_SERVICE_URL: http://device-service:8082
      TELEMETRY_SERVICE_URL: http://telemetry-service:8083
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
      device-service:
        condition: service_started
      telemetry-service:
        condition: service_started
    networks:
      - warmhouse-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  device_db_data:
    driver: local
  telemetry_db_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  warmhouse-network:
    driver: bridge
